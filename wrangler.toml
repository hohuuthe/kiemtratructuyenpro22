# Cấu hình Deploy lên Cloudflare Pages
name = "kiemtratructuyenpro"
pages_build_output_dir = "./dist"

# Môi trường tương thích
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# Các biến cấu hình được quản lý trực tiếp trong Cloudflare Pages Settings hoặc .env
  
# Production only: Cloudflare requires the target Worker to exist before Pages
# can deploy a Service binding. Preview intentionally has no BOARD_REALTIME
# binding so PR builds remain deployable before the Worker is provisioned.
[[env.production.services]]
binding = "BOARD_REALTIME"
service = "kiemtratructuyen-board-realtime"
