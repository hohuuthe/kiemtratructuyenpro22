# Cấu hình Deploy lên Cloudflare Pages
name = "kiemtratructuyenpro"
pages_build_output_dir = "./dist"

# Môi trường tương thích
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# Các biến cấu hình được quản lý trực tiếp trong Cloudflare Pages Settings hoặc .env
#
# LƯU Ý PRODUCTION:
# Không khai báo BOARD_REALTIME service binding cứng tại đây.
# Cloudflare sẽ từ chối deploy toàn bộ Pages nếu Worker đích chưa tồn tại.
# Sau khi Worker "kiemtratructuyen-board-realtime" đã được provision,
# cấu hình Service Binding BOARD_REALTIME trong Cloudflare Pages Settings.
# API Bảng tương tác đã fail-safe và trả BOARD_REALTIME_NOT_READY (503)
# nếu binding/secret chưa sẵn sàng, không làm ảnh hưởng các chức năng khác.
