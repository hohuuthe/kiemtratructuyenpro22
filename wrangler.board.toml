name = "kiemtratructuyen-board-realtime"
main = "workers/interactive-board-worker.js"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat", "web_socket_auto_reply_to_close"]

[[durable_objects.bindings]]
name = "BOARD_ROOM"
class_name = "BoardRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardRoom"]

# BOARD_REALTIME_SECRET is a runtime secret configured in Cloudflare Worker Settings.
# Do not declare it as a build-time required secret here because that prevents the
# first deployment from creating the Durable Object namespace/migration.
