<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#ffffff" rx="30" />
  
  <!-- Outer Gold Rounded Border -->
  <rect x="120" y="120" width="760" height="760" rx="50" fill="#ffffff" stroke="#E2A63B" stroke-width="18" />

  <!-- Genuine QR Code Matrix (Dark Red) -->
  <g transform="translate(180, 180) scale(15.2)">
    <path fill="#C82323" d="M0 0h57v57H0z" />
  </g>

  <!-- Left Decorations (Hanging Golden Lantern & Yellow Plum Blossoms) -->
  <g transform="translate(125, 480)">
    <line x1="0" y1="-280" x2="0" y2="-90" stroke="#E2A63B" stroke-width="6" />
    
    <!-- Top Flower Cluster -->
    <g transform="translate(-10, -220) scale(0.9)">
      <path d="M0,-28 C12,-28 22,-18 16,-5 C28,-12 35,5 28,18 C35,28 22,35 12,28 C14,38 -2,42 -12,32 C-22,42 -35,30 -28,20 C-38,14 -32,-2 -22,-6 C-28,-20 -14,-28 0,-28 Z" fill="#F4C447" stroke="#C82323" stroke-width="3" />
      <circle cx="0" cy="6" r="8" fill="#C82323" />
    </g>

    <g transform="translate(25, -160) scale(0.7)">
      <path d="M0,-28 C12,-28 22,-18 16,-5 C28,-12 35,5 28,18 C35,28 22,35 12,28 C14,38 -2,42 -12,32 C-22,42 -35,30 -28,20 C-38,14 -32,-2 -22,-6 C-28,-20 -14,-28 0,-28 Z" fill="#F4C447" stroke="#C82323" stroke-width="3" />
      <circle cx="0" cy="6" r="8" fill="#C82323" />
    </g>

    <!-- Lantern Body -->
    <g transform="translate(0, -30)">
      <path d="M-45,-70 C-70,-10 -70,50 -45,110 C-20,135 20,135 45,110 C70,50 70,-10 45,-70 Z" fill="#F4C447" stroke="#C82323" stroke-width="6" />
      <path d="M-22,-70 C-38,-10 -38,50 -22,110 M0,-70 L0,110 M22,-70 C38,-10 38,50 22,110" fill="none" stroke="#C82323" stroke-width="3" />
      <rect x="-28" y="-80" width="56" height="12" rx="4" fill="#C82323" />
      <rect x="-28" y="110" width="56" height="12" rx="4" fill="#C82323" />
      <!-- Tassel -->
      <line x1="0" y1="122" x2="0" y2="165" stroke="#C82323" stroke-width="5" />
      <path d="M-10,165 L10,165 L14,215 L-14,215 Z" fill="#C82323" />
    </g>
  </g>

  <!-- Right Decorations (Hanging Golden Lantern & Yellow Plum Blossoms) -->
  <g transform="translate(875, 520)">
    <line x1="0" y1="-300" x2="0" y2="-90" stroke="#E2A63B" stroke-width="6" />
    
    <!-- Top Main Flower -->
    <g transform="translate(0, -230) scale(0.95)">
      <path d="M0,-28 C12,-28 22,-18 16,-5 C28,-12 35,5 28,18 C35,28 22,35 12,28 C14,38 -2,42 -12,32 C-22,42 -35,30 -28,20 C-38,14 -32,-2 -22,-6 C-28,-20 -14,-28 0,-28 Z" fill="#F4C447" stroke="#C82323" stroke-width="3" />
      <circle cx="0" cy="6" r="8" fill="#C82323" />
    </g>

    <g transform="translate(-30, -170) scale(0.7)">
      <path d="M0,-28 C12,-28 22,-18 16,-5 C28,-12 35,5 28,18 C35,28 22,35 12,28 C14,38 -2,42 -12,32 C-22,42 -35,30 -28,20 C-38,14 -32,-2 -22,-6 C-28,-20 -14,-28 0,-28 Z" fill="#F4C447" stroke="#C82323" stroke-width="3" />
      <circle cx="0" cy="6" r="8" fill="#C82323" />
    </g>

    <!-- Lantern Body -->
    <g transform="translate(0, -30)">
      <path d="M-45,-70 C-70,-10 -70,50 -45,110 C-20,135 20,135 45,110 C70,50 70,-10 45,-70 Z" fill="#F4C447" stroke="#C82323" stroke-width="6" />
      <path d="M-22,-70 C-38,-10 -38,50 -22,110 M0,-70 L0,110 M22,-70 C38,-10 38,50 22,110" fill="none" stroke="#C82323" stroke-width="3" />
      <rect x="-28" y="-80" width="56" height="12" rx="4" fill="#C82323" />
      <rect x="-28" y="110" width="56" height="12" rx="4" fill="#C82323" />
      <!-- Tassel -->
      <line x1="0" y1="122" x2="0" y2="165" stroke="#C82323" stroke-width="5" />
      <path d="M-10,165 L10,165 L14,215 L-14,215 Z" fill="#C82323" />
    </g>
  </g>
