<div id="account-modal" class="fixed inset-0 z-[99999] hidden">
    <div class="modal-overlay absolute inset-0 bg-gray-900/40 backdrop-blur-sm"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
     <div class="bg-white border border-gray-100 rounded-3xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto relative z-10 bounce-in p-6">
      <!-- Close Button -->
      <button onclick="closeAccountModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 transition hover:bg-gray-50 p-2 rounded-xl" title="Đóng">
       <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
       </svg>
      </button>

      <!-- Header -->
      <div class="mb-5 text-center">
        <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-2 text-2xl font-bold">🔑</div>
        <h3 id="account-modal-title" class="text-xl font-black text-gray-950 tracking-tight uppercase">CẤU HÌNH TÀI KHOẢN ĐĂNG NHẬP</h3>
        <p class="text-[11px] text-gray-500 mt-1">Quản lý tài khoản đăng nhập & mật khẩu gắn với hồ sơ người dùng</p>
      </div>

      <input type="hidden" id="acc-id">
      
      <div class="space-y-4">
        <!-- 1. LIÊN KẾT HỒ SƠ NGƯỜI DÙNG -->
        <div class="p-3.5 bg-purple-50/60 border border-purple-200/80 rounded-2xl">
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-[11px] font-black text-purple-900 uppercase tracking-wider flex items-center gap-1.5">
              <span>👤</span> HỒ SƠ NGƯỜI DÙNG LIÊN KẾT *
            </label>
            <button type="button" onclick="window.switchToUserModalFromAccount()" class="text-[11px] text-purple-700 hover:text-purple-900 font-bold underline cursor-pointer flex items-center gap-1">
              + Tạo hồ sơ mới
            </button>
          </div>
          
          <select id="acc-user-id-select" onchange="window.onSelectUserForAccount(this.value)" class="w-full bg-white border border-purple-300 text-gray-900 text-sm px-3 py-2.5 rounded-xl focus:border-purple-600 focus:ring-2 focus:ring-purple-500/20 focus:outline-none transition shadow-xs">
            <option value="">-- Bấm để chọn hồ sơ người dùng trong hệ thống --</option>
          </select>
          <input type="hidden" id="acc-user-id">

          <!-- Card xem tóm tắt thông tin hồ sơ đã chọn -->
          <div id="acc-user-preview-card" class="hidden mt-2.5 pt-2.5 border-t border-purple-200/70 text-xs text-purple-950 flex flex-wrap items-center justify-between gap-2">
            <div>
              <span class="font-bold" id="acc-user-preview-name">Nguyễn Văn A</span>
              <span class="text-purple-600 ml-1.5 font-mono text-[11px]" id="acc-user-preview-id">(ID: usr_123)</span>
              <div class="text-[11px] text-purple-700 mt-0.5" id="acc-user-preview-details">SĐT: 0912345678 • Học sinh</div>
            </div>
            <button type="button" onclick="window.viewSelectedUserProfile()" class="px-2.5 py-1 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-[10px] font-bold transition shadow-xs flex items-center gap-1 cursor-pointer">
              <span>🔍</span> Xem hồ sơ
            </button>
          </div>
        </div>

        <!-- 2. TÊN ĐĂNG NHẬP -->
        <div>
          <div class="flex items-center justify-between mb-1 ml-1">
            <label class="block text-[10px] font-bold text-gray-700 uppercase tracking-wider">TÊN TÀI KHOẢN ĐĂNG NHẬP *</label>
            <button type="button" onclick="window.autoSuggestUsername()" class="text-[10px] text-purple-600 hover:text-purple-800 font-bold cursor-pointer">
              ⚡ Gợi ý tự động
            </button>
          </div>
          <div class="relative">
            <input type="text" id="acc-username" placeholder="Nhập tên đăng nhập (vd: nguyenvanan)..." class="w-full bg-gray-50 border border-gray-200 text-gray-900 font-mono text-sm px-3.5 py-2.5 pl-9 rounded-xl focus:border-purple-500 focus:bg-white focus:ring-2 focus:ring-purple-500/10 focus:outline-none transition-all placeholder:text-gray-400">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">@</span>
          </div>
        </div>

        <!-- 3. MẬT KHẨU -->
        <div>
          <div class="flex items-center justify-between mb-1 ml-1">
            <label class="block text-[10px] font-bold text-gray-700 uppercase tracking-wider">MẬT KHẨU *</label>
            <button type="button" onclick="window.generateRandomPasswordForAccount()" class="text-[10px] text-purple-600 hover:text-purple-800 font-bold cursor-pointer">
              🎲 Tạo mật khẩu mạnh
            </button>
          </div>
          <div class="relative">
            <input type="text" id="acc-password" placeholder="Nhập mật khẩu tài khoản..." class="w-full bg-gray-50 border border-gray-200 text-gray-900 font-mono text-sm px-3.5 py-2.5 pr-10 rounded-xl focus:border-purple-500 focus:bg-white focus:ring-2 focus:ring-purple-500/10 focus:outline-none transition-all placeholder:text-gray-400">
            <button type="button" onclick="window.toggleAccountPasswordVisibility()" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 p-1 rounded-md" title="Hiện/Ẩn mật khẩu">
              <span id="acc-password-eye-icon">👁️</span>
            </button>
          </div>
        </div>

        <!-- 4. QUYỀN HẠN & NGÀY HẾT HẠN -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-bold text-gray-700 mb-1 ml-1 uppercase tracking-wider">QUYỀN HẠN TRUY CẬP</label>
            <select id="acc-role" class="w-full bg-gray-50 border border-gray-200 text-gray-900 px-3 py-2.5 rounded-xl focus:border-purple-500 focus:bg-white focus:outline-none text-sm font-semibold">
              <option value="user">Người dùng (user)</option>
              <option value="admin">Quản trị viên (admin)</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-gray-700 mb-1 ml-1 uppercase tracking-wider">HẠN DÙNG TÀI KHOẢN</label>
            <input type="date" id="acc-expiry" class="w-full bg-gray-50 border border-gray-200 text-gray-900 px-3 py-2.5 rounded-xl focus:border-purple-500 focus:bg-white focus:outline-none text-sm">
          </div>
        </div>

        <!-- 5. TRẠNG THÁI TÀI KHOẢN -->
        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
          <div>
            <div class="text-xs font-bold text-gray-800">Trạng thái đăng nhập</div>
            <div class="text-[11px] text-gray-500">Cho phép tài khoản này đăng nhập vào hệ thống</div>
          </div>
          <div class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="acc-active" class="sr-only peer" checked>
            <div class="w-10 h-5 bg-gray-200 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-purple-600"></div>
          </div>
        </div>
      </div>
      
      <!-- Footer Actions -->
      <div class="mt-6 flex gap-3 pt-4 border-t border-gray-100">
       <button type="button" onclick="closeAccountModal()" class="flex-1 px-4 py-2.5 bg-gray-100 text-gray-600 rounded-xl hover:bg-gray-200 transition font-bold text-xs uppercase tracking-widest cursor-pointer">Hủy bỏ</button>
       <button type="button" onclick="saveAccount()" class="flex-[2] px-4 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl hover:from-purple-500 hover:to-indigo-500 shadow-lg shadow-purple-500/20 transition-all font-bold text-xs uppercase tracking-widest flex items-center justify-center gap-1.5 cursor-pointer">
         <span>💾</span> Lưu tài khoản
       </button>
      </div>
     </div>
    </div>
</div>
