<div id="tab-documents" class="tab-content w-full">
<section class="bg-white rounded-2xl shadow-xl p-4 sm:p-6 space-y-5">
 <header class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-4">
  <div><h2 class="font-black text-xl text-slate-900">📚 QL Tài liệu</h2><p class="text-sm text-slate-500">Thư viện liên kết tài liệu chia sẻ theo đối tượng và thời hạn truy cập.</p></div>
  <div class="flex flex-wrap gap-2"><button id="documents-new" type="button" class="hidden rounded-lg bg-emerald-700 px-4 py-2 text-white font-bold text-sm">＋ Thêm tài liệu</button><button id="documents-reload" type="button" class="rounded-lg bg-slate-100 px-4 py-2 text-slate-700 font-semibold text-sm">↻ Tải lại</button></div>
 </header>
 <div class="flex flex-wrap gap-3 items-center"><input id="documents-search" aria-label="Tìm kiếm tài liệu" class="border rounded-lg px-3 py-2 flex-1 min-w-48 text-sm" placeholder="Tìm tiêu đề, địa chỉ liên kết..."><select id="documents-audience-filter" aria-label="Lọc đối tượng truy cập" class="border rounded-lg px-3 py-2 text-sm"><option value="">Tất cả đối tượng</option><option value="public">Công khai</option><option value="authenticated">Đã đăng nhập</option><option value="teacher">Giáo viên</option><option value="student">Học sinh</option><option value="admin">Quản trị viên</option></select><span id="documents-total" class="text-xs text-slate-500"></span></div>
 <div id="documents-feedback" class="hidden text-sm rounded-lg p-3" role="status"></div>
 <div class="overflow-x-auto rounded-xl border border-slate-200"><table class="w-full min-w-[850px] text-sm"><thead class="bg-slate-50 text-slate-700"><tr><th class="p-3 text-left">STT</th><th class="p-3 text-left">Tiêu đề</th><th class="p-3 text-left">Đường liên kết</th><th class="p-3 text-left">Đối tượng</th><th class="p-3 text-left">Hết hạn</th><th class="p-3 text-center">Hoạt động</th><th class="p-3 text-center">Thao tác</th></tr></thead><tbody id="documents-table-body"><tr><td colspan="7" class="p-6 text-center text-slate-500">Đang tải...</td></tr></tbody></table></div>
 <p class="text-xs text-slate-500">Liên kết chỉ được liệt kê khi tài khoản có quyền. Việc truy cập tệp gốc còn phụ thuộc quyền chia sẻ ở nơi lưu trữ.</p>
</section>
<div id="documents-modal" class="hidden fixed inset-0 z-[210] bg-black/60 p-3 flex items-center justify-center" role="dialog" aria-modal="true" aria-labelledby="documents-modal-title">
 <form id="documents-form" class="bg-white rounded-2xl shadow-2xl w-full max-w-xl max-h-[92vh] overflow-auto p-5 sm:p-7 space-y-4">
  <div class="flex items-center justify-between gap-2"><h3 id="documents-modal-title" class="font-black text-xl">Thêm tài liệu</h3><button id="documents-cancel-top" type="button" aria-label="Đóng" class="rounded-lg border px-3 py-2">✕</button></div>
  <input name="id" type="hidden">
  <label class="block text-sm font-bold">Tiêu đề *<input name="tieu_de" required maxlength="180" class="mt-1 block w-full border rounded-lg p-3 font-normal" placeholder="Ví dụ: Tài liệu ôn tập Tin học 12"></label>
  <label class="block text-sm font-bold">Mô tả<textarea name="mo_ta" maxlength="4000" rows="2" class="mt-1 block w-full border rounded-lg p-3 font-normal" placeholder="Nội dung tài liệu (không bắt buộc)"></textarea></label><label class="block text-sm font-bold">Danh mục<input name="danh_muc" maxlength="100" value="Chung" class="mt-1 block w-full border rounded-lg p-3 font-normal"></label>
  <label class="block text-sm font-bold">Đường liên kết HTTPS *<input name="duong_link" type="url" required maxlength="2048" placeholder="https://..." class="mt-1 block w-full border rounded-lg p-3 font-normal"></label>
  <label class="block text-sm font-bold">Đối tượng được truy cập<select name="doi_tuong_duoc_truy_cap" class="mt-1 block w-full border rounded-lg p-3 font-normal"><option value="authenticated">Tất cả tài khoản đã đăng nhập</option><option value="public">Công khai, gồm khách</option><option value="teacher">Giáo viên</option><option value="student">Học sinh</option><option value="admin">Quản trị viên</option></select></label>
  <label class="block text-sm font-bold">Thời gian hết hạn (giờ Việt Nam)<input type="datetime-local" name="thoi_gian_het_han" class="mt-1 block w-full border rounded-lg p-3 font-normal"><span class="block text-xs text-slate-500 font-normal mt-1">Để trống nếu liên kết không hết hạn.</span></label>
  <label class="flex items-center gap-2 text-sm font-semibold"><input name="hoat_dong" type="checkbox" checked class="w-4 h-4"> Cho phép hoạt động</label>
  <div class="flex justify-end gap-2 pt-2"><button id="documents-cancel" type="button" class="rounded-lg border px-4 py-2 font-semibold">Hủy</button><button type="submit" class="rounded-lg bg-emerald-700 text-white px-5 py-2 font-bold">Lưu tài liệu</button></div>
 </form>
</div>
</div>
