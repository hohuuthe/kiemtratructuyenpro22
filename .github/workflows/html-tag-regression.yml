name: Literal HTML tags in questions
on:
  push:
    paths:
      - 'src/scientific-formula-engine.ts'
      - 'src/exam-docx-generator.ts'
      - 'tests/html-tag-literal-regression.test.mjs'
      - '.github/workflows/html-tag-regression.yml'
  pull_request:
    paths:
      - 'src/scientific-formula-engine.ts'
      - 'src/exam-docx-generator.ts'
      - 'tests/html-tag-literal-regression.test.mjs'
      - '.github/workflows/html-tag-regression.yml'
permissions:
  contents: read
jobs:
  html-tag-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --import tsx --test tests/html-tag-literal-regression.test.mjs
      - run: node --import tsx --test tests/scientific-formula-unified.test.mjs tests/exam-detail-formula-parity.test.mjs tests/exam-export-regression.test.mjs
      - run: npm run lint
      - run: npm run build
