name: Essay grading safety, lint and build
on:
  push:
    branches: [feat/essay-key-pool-20261027]
  pull_request:
    paths:
      - 'src/essay-grading-pipeline.js'
      - 'functions/api/exam/**'
      - 'functions/api/results*'
      - 'tests/*essay*.test.mjs'
      - 'tests/exam-grading-safety.test.mjs'
      - 'src/exam-grading-safety.js'
      - 'functions/api/results.ts'
      - '.github/workflows/essay-grading-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/durable-essay-grading.test.mjs tests/essay-key-pool.test.mjs tests/exam-grading-safety.test.mjs
      - run: npm run lint
      - run: npm run build
