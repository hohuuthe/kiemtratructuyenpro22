name: Retry pending essay AI grades
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ESSAY_RETRY_URLS: ${{ vars.ESSAY_RETRY_URLS }}
      ESSAY_RETRY_CRON_SECRET: ${{ secrets.ESSAY_RETRY_CRON_SECRET }}
    steps:
      - name: Process pending submissions on each configured tenant host
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ESSAY_RETRY_CRON_SECRET" ] || [ -z "$ESSAY_RETRY_URLS" ]; then
            echo "Essay retry is not yet configured."
            exit 0
          fi
          while IFS= read -r url || [ -n "$url" ]; do
            [ -z "$url" ] && continue
            case "$url" in
              https://*/api/exam/retry-pending) ;;
              *) echo "Ignoring invalid tenant URL."; continue;;
            esac
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 70 --request POST --header "Authorization: Bearer $ESSAY_RETRY_CRON_SECRET" "$url" || true)
            echo "Tenant grading sweep: HTTP ${status}"
            if [ "$status" != "200" ]; then exit 1; fi
          done <<< "$ESSAY_RETRY_URLS"
