name: Question lesson loading race regression
on:
  push:
    branches: [fix/question-lesson-load-race-20261027]
  pull_request:
    paths:
      - 'src/main.js'
      - 'src/question-bank-level-filter.js'
      - 'public/components/tab-questions.html'
      - 'tests/question-bank-level-filter.test.mjs'
      - 'tests/question-lesson-load-race.test.mjs'
      - '.github/workflows/question-lesson-load-race.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/question-lesson-load-race.test.mjs tests/exam-tab-separation.test.mjs tests/question-bank-recent-view.test.mjs tests/question-bank-level-filter.test.mjs
      - run: npm run lint
      - run: npm run build
