name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - 'workers/interactive-board-worker.js'
      - 'wrangler.board.toml'
      - 'functions/**'
      - 'src/**'
      - 'public/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify interactive board release
        run: npm run release:interactive-board:check

      - name: Deploy realtime Worker
        run: npx wrangler deploy --config wrangler.board.toml

      - name: Build Pages
        run: npm run build

      - name: Deploy Pages production
        run: npx wrangler pages deploy dist --project-name kiemtratructuyenpro --branch main --commit-dirty=true
