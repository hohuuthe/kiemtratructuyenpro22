name: Exam question pool integrity
on:
  push:
    branches: [fix/exam-config-question-pool-verified-20261107]
  pull_request:
    paths:
      - 'src/main.js'
      - 'src/exam-question-pool-integrity.js'
      - 'tests/exam-question-pool-integrity.test.mjs'
      - 'tests/question-lesson-load-race.test.mjs'
      - 'tests/exam-tab-separation.test.mjs'
      - '.github/workflows/exam-question-pool-integrity.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/exam-question-pool-integrity.test.mjs tests/question-lesson-load-race.test.mjs tests/exam-tab-separation.test.mjs
      - run: npm run lint
      - run: npm run build
