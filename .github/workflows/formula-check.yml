name: Formula rendering checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/scientific-formulas-student-exam-20261022]

permissions:
  contents: read

jobs:
  validate:
    name: Test formulas and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Formula tokenizer regression tests
        run: node --test tests/scientific-formula-tokenizer.test.mjs tests/scientific-formula-acceptance.test.mjs tests/scientific-formula-student-view.test.mjs
      - name: Cross-surface scientific formula export tests
        run: node --import tsx --test tests/scientific-formula-unified.test.mjs tests/exam-export-regression.test.mjs tests/exam-detail-formula-parity.test.mjs
      - name: Production build
        run: npm run build
      - name: Ensure DEV-only result fixture is absent in Production
        run: |
          if grep -R -l "__openExamDetailScientificFixture" dist; then
            echo "::error::DEV-only exam detail fixture was included in the Production bundle."
            exit 1
          fi
