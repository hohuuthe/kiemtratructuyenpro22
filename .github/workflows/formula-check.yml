name: Formula rendering checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor/word-import-questions-only-20261023]

permissions:
  contents: read

jobs:
  validate:
    name: Test formulas and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Formula tokenizer regression tests
        run: node --test tests/scientific-formula-tokenizer.test.mjs tests/scientific-formula-acceptance.test.mjs tests/scientific-formula-student-view.test.mjs
      - name: Cross-surface scientific formula export tests
        run: node --import tsx --test tests/scientific-formula-unified.test.mjs tests/exam-export-regression.test.mjs tests/exam-word-smart-options.test.mjs tests/exam-detail-formula-parity.test.mjs tests/word-editable-chemistry.test.mjs tests/question-bank-word-export.test.mjs tests/question-bank-fraction-regression.test.mjs
      - name: Verified Word Office Math import and database transaction tests
        run: node --import tsx --test tests/word-import-omml.test.mjs tests/word-import-transaction.test.mjs
      - name: Word answer-grading contract and formula tokenizer regression
        run: node --import tsx --test tests/word-import-answer-contract.test.mjs
      - name: Complete Word corpus import and re-export fidelity
        run: node --import tsx --test tests/word-import-corpus-roundtrip.test.mjs
      - name: PostgreSQL rollback and actual Neon driver contract
        run: node --import tsx --test tests/word-import-postgres.test.mjs
      - name: Deterministic Word-image upload retry contract
        run: node --test tests/word-import-image-key.test.mjs
      - name: Chemistry arrow positioning in exam and question-bank DOCX
        run: node --import tsx --test tests/word-chemistry-arrow-position.test.mjs
      - name: Word OMML heating-arrow roundtrip and both export paths
        run: node --import tsx --test tests/word-import-chemistry-heat-roundtrip.test.mjs
      - name: Exam management and editor tab business contract
        run: node --import tsx --test tests/exam-config-integrity.test.ts tests/exam-tab-separation.test.mjs tests/question-list-single-actions.test.mjs tests/question-bank-recent-view.test.mjs tests/question-teacher-filter.test.mjs tests/question-delete-by-lesson.test.ts tests/exam-config-table-layout.test.mjs tests/exam-export-modal-layout.test.mjs tests/ranking-unit-filter.test.mjs tests/ranking-teacher-filter.test.mjs
      - name: Student private results authorization, display and IDOR tests
        run: node --import tsx --test tests/student-results-privacy.test.ts tests/student-results-duration.test.mjs tests/student-results-modern-ui.test.mjs tests/student-result-visibility.test.ts
      - name: Runtime authentication revocation tests
        run: node --import tsx --test tests/security-session-runtime.test.ts
      - name: Tenant / revocation / CAS integration contracts
        run: node --import tsx --test tests/security-tenant-integration.test.ts
      - name: Production build
        run: npm run build
      - name: Ensure DEV-only result fixture is absent in Production
        run: |
          if grep -R -l "__openExamDetailScientificFixture" dist; then
            echo "::error::DEV-only exam detail fixture was included in the Production bundle."
            exit 1
          fi
      - name: Upload Word round-trip acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-import-corpus-acceptance
          path: artifacts/corpus-review/
          retention-days: 14
          if-no-files-found: warn
