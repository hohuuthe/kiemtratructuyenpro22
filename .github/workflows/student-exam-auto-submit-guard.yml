name: Student exam premature auto-submit guard

on:
  pull_request:
    paths:
      - 'src/main.js'
      - 'src/student-exam-session-guard.js'
      - 'src/student-exam-background.js'
      - 'functions/api/exam/generate.ts'
      - 'functions/api/exam/start.ts'
      - 'functions/api/exam/checkpoint.ts'
      - 'functions/api/exam/feedback.ts'
      - 'functions/api/exam/grade.ts'
      - 'tests/student-exam-auto-submit-guard.test.mjs'
      - 'tests/exam-grading-integrity.test.mjs'
      - '.github/workflows/student-exam-auto-submit-guard.yml'
  push:
    paths:
      - 'src/main.js'
      - 'src/student-exam-session-guard.js'
      - 'src/student-exam-background.js'
      - 'functions/api/exam/generate.ts'
      - 'functions/api/exam/start.ts'
      - 'functions/api/exam/checkpoint.ts'
      - 'functions/api/exam/feedback.ts'
      - 'functions/api/exam/grade.ts'
      - 'tests/student-exam-auto-submit-guard.test.mjs'
      - 'tests/exam-grading-integrity.test.mjs'
      - '.github/workflows/student-exam-auto-submit-guard.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check src/main.js
      - run: node --test tests/student-exam-auto-submit-guard.test.mjs tests/exam-grading-integrity.test.mjs
      - run: npm run lint
      - run: npm run build
