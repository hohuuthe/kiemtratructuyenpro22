name: Exam no-resume P0 release gate
on:
  pull_request:
    paths:
      - 'src/exam-exit-policy.js'
      - 'src/exam-lifecycle-client.js'
      - 'src/main.js'
      - 'functions/api/exam/**'
      - 'workers/exam-finalizer-worker.ts'
      - 'wrangler.exam-finalizer.toml'
      - 'src/exam-finalizer-marker.ts'
      - 'server.ts'
      - 'tests/exam-no-resume-liveness.test.mjs'
      - 'tests/exam-orphan-reconcile-db.test.mjs'
      - 'tests/exam-legacy-bootstrap-db.test.mjs'
      - 'tests/exam-contest-committed-reconcile.test.mjs'
      - 'tests/exam-contest-orphan-db.test.mjs'
      - 'tests/exam-fresh-attempt-db.test.mjs'
      - 'functions/api/exam/fresh-attempt.ts'
      - 'tests/exam-start-retry.test.mjs'
      - 'src/student-exam-start-guard.js'
      - 'functions/api/exam/orphan-reconcile.ts'
      - '.github/workflows/exam-no-resume-release.yml'
permissions:
  contents: read
jobs:
  p0-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax
        run: node --check src/main.js && node --check src/exam-lifecycle-client.js
      - name: New session lifecycle and liveness regressions
        run: node --test tests/exam-no-resume-liveness.test.mjs tests/exam-start-retry.test.mjs
      - name: Real production SQL orphan lock integration regression
        run: node --test tests/exam-orphan-reconcile-db.test.mjs tests/exam-legacy-bootstrap-db.test.mjs tests/exam-contest-committed-reconcile.test.mjs tests/exam-contest-orphan-db.test.mjs tests/exam-fresh-attempt-db.test.mjs
      - name: TypeScript lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Compile isolated Cron Worker (no Cloudflare deployment)
        run: npx --yes wrangler@4.54.0 deploy --dry-run --config wrangler.exam-finalizer.toml
