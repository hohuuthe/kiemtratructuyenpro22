name: Exam no-resume P0 release gate
on:
  pull_request:
    paths:
      - 'src/exam-exit-policy.js'
      - 'src/exam-lifecycle-client.js'
      - 'src/main.js'
      - 'functions/api/exam/**'
      - 'workers/exam-finalizer-worker.ts'
      - 'server.ts'
      - 'tests/exam-no-resume-liveness.test.mjs'
      - '.github/workflows/exam-no-resume-release.yml'
permissions:
  contents: read
jobs:
  p0-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax
        run: node --check src/main.js && node --check src/exam-lifecycle-client.js
      - name: New session lifecycle and liveness regressions
        run: node --test tests/exam-no-resume-liveness.test.mjs
      - name: TypeScript lint
        run: npm run lint
      - name: Production build
        run: npm run build
