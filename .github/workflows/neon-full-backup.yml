name: Neon full database backup

on:
  workflow_dispatch:
  schedule:
    - cron: '20 18 * * *'

permissions:
  contents: read

concurrency:
  group: neon-full-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATABASE_URL: \${{ secrets.NEON_DATABASE_URL }}
      POSTGRES_IMAGE: postgres:18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source secret
        shell: bash
        run: |
          if [[ -z "\${SOURCE_DATABASE_URL}" ]]; then
            echo "::error::Missing repository secret NEON_DATABASE_URL."
            exit 1
          fi

      - name: Create one-file full backup
        shell: bash
        run: |
          chmod +x scripts/neon-full-backup.sh
          scripts/neon-full-backup.sh "backups/neon-full-backup-\${GITHUB_RUN_ID}.tar.gz"
          ls -lh backups/

      - name: Upload protected GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-full-backup
          path: backups/neon-full-backup-*.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Neon full backup"
            echo ""
            echo "- Run ID: \${GITHUB_RUN_ID}"
            echo "- PostgreSQL client: \${POSTGRES_IMAGE}"
            echo "- Artifact: neon-full-backup"
            echo "- Retention: 30 days"
          } >> "\${GITHUB_STEP_SUMMARY}"
