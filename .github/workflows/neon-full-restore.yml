name: Phuc_hoi_CSDL_sang_CSDL_moi_HOHUUTHE

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'Run ID of Neon full database backup'
        required: true
        type: string
      confirm_restore:
        description: 'Type RESTORE to confirm target replacement'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: neon-full-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_DATABASE_URL: ${{ secrets.TARGET_NEON_DATABASE_URL }}
      POSTGRES_IMAGE: postgres:18

    steps:
      - name: Validate confirmation and target secret
        shell: bash
        run: |
          if [[ "${{ inputs.confirm_restore }}" != "RESTORE" ]]; then
            echo "::error::Confirmation must be exactly RESTORE."
            exit 1
          fi
          if [[ -z "${TARGET_DATABASE_URL}" ]]; then
            echo "::error::Missing repository secret TARGET_NEON_DATABASE_URL."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download selected backup artifact
        uses: actions/download-artifact@v4
        with:
          name: Sao_luu_CSDL_HOHUUTHE
          path: restore-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.backup_run_id }}

      - name: Restore into target Neon database
        shell: bash
        env:
          ALLOW_DESTRUCTIVE_RESTORE: YES
        run: |
          chmod +x scripts/Phuc_hoi_CSDL_sang_CSDL_moi_HOHUUTHE.sh
          BACKUP_FILE="$(find restore-input -type f -name 'Sao_luu_CSDL_HOHUUTHE-*.tar.gz' -print -quit)"
          if [[ -z "${BACKUP_FILE}" ]]; then
            echo "::error::Backup archive not found in downloaded artifact."
            exit 1
          fi
          scripts/Phuc_hoi_CSDL_sang_CSDL_moi_HOHUUTHE.sh "${BACKUP_FILE}"

      - name: Summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Neon restore completed"
            echo ""
            echo "- Source backup run: ${{ inputs.backup_run_id }}"
            echo "- Target connection came from repository secret TARGET_NEON_DATABASE_URL."
            echo "- Restore ran with transaction + exit-on-error."
          } >> "${GITHUB_STEP_SUMMARY}"
